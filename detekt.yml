build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

# ── Formatting (detekt-formatting / ktlint) ───────────────────────────────
# Disable ALL ktlint formatting rules — code style is enforced by the IDE.
formatting:
  active: false
  android: true
  ArgumentListWrapping:
    active: false
  ChainWrapping:
    active: false
  CommentSpacing:
    active: false
  EnumEntryNameCase:
    active: false
  Filename:
    active: false
  FinalNewline:
    active: false
  FunctionNaming:
    active: false
  FunctionReturnTypeSpacing:
    active: false
  FunctionStartOfBodySpacing:
    active: false
  FunctionTypeReferenceSpacing:
    active: false
  ImportOrdering:
    active: false
  Indentation:
    active: false
  KdocWrapping:
    active: false
  MaxLineLength:
    active: false
  ModifierListSpacing:
    active: false
  ModifierOrdering:
    active: false
  MultiLineIfElse:
    active: false
  NoBlankLineBeforeRbrace:
    active: false
  NoConsecutiveBlankLines:
    active: false
  NoEmptyClassBody:
    active: false
  NoEmptyFirstLineInMethodBlock:
    active: false
  NoLineBreakAfterElse:
    active: false
  NoLineBreakBeforeAssignment:
    active: false
  NoMultipleSpaces:
    active: false
  NoSemicolons:
    active: false
  NoTrailingSpaces:
    active: false
  NoUnitReturn:
    active: false
  NoUnusedImports:
    active: false    # handled by style:UnusedImports below
  NoWildcardImports:
    active: false    # handled by style:WildcardImport below
  PackageName:
    active: false
  ParameterListWrapping:
    active: false
  SpacingAroundAngleBrackets:
    active: false
  SpacingAroundColon:
    active: false
  SpacingAroundComma:
    active: false
  SpacingAroundCurly:
    active: false
  SpacingAroundDot:
    active: false
  SpacingAroundDoubleColon:
    active: false
  SpacingAroundKeyword:
    active: false
  SpacingAroundOperators:
    active: false
  SpacingAroundParens:
    active: false
  SpacingAroundRangeOperator:
    active: false
  SpacingAroundUnaryOperator:
    active: false
  SpacingBetweenDeclarationsWithAnnotations:
    active: false
  SpacingBetweenDeclarationsWithComments:
    active: false
  StringTemplate:
    active: false
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
  TypeArgumentListSpacing:
    active: false
  TypeParameterListSpacing:
    active: false
  UnnecessaryParenthesesBeforeTrailingLambda:
    active: false
  Wrapping:
    active: false

# ── Complexity ────────────────────────────────────────────────────────────
complexity:
  active: true
  LongMethod:
    active: true
    threshold: 700       # HomeScreen, MainActivity NavHost are legitimately long
  LongParameterList:
    active: true
    functionThreshold: 25   # Compose screens pass many lambdas by design
    constructorThreshold: 10
  CyclomaticComplexMethod:
    active: true
    threshold: 70        # startImport, inferCategory in OnboardingViewModel
  ComplexCondition:
    active: true
    threshold: 9         # SmsParser.isBankSms has 8 conditions by design
  TooManyFunctions:
    active: false
  StringLiteralDuplication:
    active: false
  LargeClass:
    active: false        # ViewModels are large by design (Firebase coupling)
  NestedBlockDepth:
    active: false        # Coroutine + Firestore callbacks nest naturally

# ── Coroutines ────────────────────────────────────────────────────────────
coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunWithFlowReturnType:
    active: true

# ── Exceptions ────────────────────────────────────────────────────────────
exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false        # Firebase callbacks catch Exception broadly
  SwallowedException:
    active: false
  InstanceOfCheckForException:
    active: false        # `if (e is CancellationException) throw e` is correct coroutine pattern
  PrintStackTrace:
    active: true         # printStackTrace goes nowhere in production — use Log.e

# ── Naming ────────────────────────────────────────────────────────────────
naming:
  active: true
  MatchingDeclarationName:
    active: false        # FilterType sealed class lives in AllRecordsScreen.kt intentionally
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludes: ['**/test/**', '**/androidTest/**']
    ignoreAnnotated: ['Composable', 'Preview']

# ── Potential bugs ────────────────────────────────────────────────────────
potential-bugs:
  active: true
  ImplicitDefaultLocale:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
  DontDowncastCollectionTypes:
    active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: false

# ── Style ─────────────────────────────────────────────────────────────────
style:
  active: true
  MagicNumber:
    active: false
  ReturnCount:
    active: true
    max: 15              # inferType functions have many early-return branches by design
  UnusedPrivateMember:
    active: true
  MaxLineLength:
    active: false
  NewLineAtEndOfFile:
    active: true
  LoopWithTooManyJumpStatements:
    active: false        # OnboardingViewModel CSV parsing uses multiple continue/break
  WildcardImport:
    active: true
    excludeImports:
      - 'androidx.compose.foundation.layout.*'
      - 'androidx.compose.material.icons.filled.*'
      - 'androidx.compose.material.icons.automirrored.filled.*'
      - 'androidx.compose.material3.*'
      - 'androidx.compose.runtime.*'
      - 'androidx.compose.ui.*'
      - 'com.example.wallettrackers.model.*'
      - 'com.example.wallettrackers.screens.*'
      - 'java.util.*'
      - 'io.ktor.client.*'
      - 'io.ktor.client.call.*'
      - 'io.ktor.client.engine.cio.*'
      - 'io.ktor.client.plugins.contentnegotiation.*'
      - 'io.ktor.client.request.*'
      - 'io.ktor.client.statement.*'
      - 'io.ktor.serialization.kotlinx.json.*'
      - 'androidx.work.*'
